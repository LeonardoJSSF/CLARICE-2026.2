<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Animação CSS</title>
    <link rel="stylesheet" href="../ATIVIDADES-CSS/aula1910.css">
    <script src="../ATIVIDADES-JS/aula1910.js"></script>

   <!-- Biblioteca Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body>

    <a href="../index.html" type="button" class="voltar">VOLTAR</a>

    <h1 id="titulo">Biblioteca Animate.CSS</h1>
    <img id="imagem" src="../IMAGENS/imagensimples.jpg" alt="Paisagem natural">
    <p id="texto">Clique no botão para iniciar!</p>
    <button onclick="iniciar()">Iniciar animação</button>

    <br>

    <h2 class="animate__animated animate__fadeIn">
        Aparece gradualmente
    </h2>

    <h2 class="animate__animated animate__backInLeft">
        Entra pela esquerda
    </h2>

    <h2 class="animate__animated animate__rotateIn">
        Entra girando
    </h2>

    <h2 class="animate__animated animate__heartBeat">
        Pulsa como um coração
    </h2>

    <h2 class="animate__animated animate__shakeX">
        Balança horizontalmente
    </h2>


</body>
</html>
